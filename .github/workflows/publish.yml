name: publish

# Signs and publishes the Marquee feed. Runs only for a push to main that
# changes catalog.yaml, or by hand. Never for a pull request.
#
#   tools    builds expansion-index; no environment, no secrets
#   publish  the only signer; reads the protected signing environment
#   docs     opens the Marquee page pull request; holds only the docs token

on:
  push:
    branches: [main]
    paths: [catalog.yaml]
  workflow_dispatch:

permissions: {}

env:
  # The PUBLIC SDK commit expansion-index is built from (Phase 57 plan 57-07).
  STAGEHAND_SDK_REF: 3f20688bb330e7a0f1488c7890f94b292e38a11e
  INDEX_REF: oci://ghcr.io/puppet-stagehand/catalog
  DOCS_REPO: puppetlabs/stagehand-docs

jobs:
  tools:
    name: Build expansion-index
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      - name: Check out the public SDK at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: puppet-stagehand/stagehand-sdk
          ref: ${{ env.STAGEHAND_SDK_REF }}
          path: stagehand-sdk
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: stagehand-sdk/cmd/expansion-index/go.mod
          cache: false

      - name: Build expansion-index
        working-directory: stagehand-sdk/cmd/expansion-index
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          go build -trimpath -o "$GITHUB_WORKSPACE/out/expansion-index" .

      - name: Record the checksum
        id: sum
        working-directory: out
        run: |
          set -euo pipefail
          sha256sum expansion-index | cut -d' ' -f1 > expansion-index.sha256
          echo "sha256=$(cat expansion-index.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload the tool
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expansion-index
          path: |
            out/expansion-index
            out/expansion-index.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Sign and publish
    needs: tools
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: marquee-publish
    concurrency:
      group: marquee-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.build.outputs.tag }}
      generated_at: ${{ steps.build.outputs.generated_at }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tool
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: expansion-index
          path: tool

      - name: Refuse a tool whose checksum differs
        env:
          EXPECTED_SHA256: ${{ needs.tools.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum tool/expansion-index | cut -d' ' -f1)"
          if [ -z "$EXPECTED_SHA256" ] || [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "expansion-index checksum differs from the tools job: refusing to use it" >&2
            exit 1
          fi
          chmod 0755 tool/expansion-index
          echo "EXPANSION_INDEX=$GITHUB_WORKSPACE/tool/expansion-index" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Log in to ghcr.io with the job token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_dir="$RUNNER_TEMP/docker-auth"
          mkdir -p "$auth_dir"
          echo "DOCKER_CONFIG=$auth_dir" >> "$GITHUB_ENV"
          printf '%s' "$GITHUB_TOKEN" | DOCKER_CONFIG="$auth_dir" docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Reviewed candidates only: build validates every candidate manifest before
      # anything is signed. The previous index is read with the job token so a
      # package nobody has created yet answers "not found" instead of GHCR's
      # anonymous DENIED. A 401 or 403 on an existing feed stops the run.
      - name: Build the index
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_REGISTRY_USERNAME: ${{ secrets.STAGING_REGISTRY_USERNAME }}
          STAGING_REGISTRY_TOKEN: ${{ secrets.STAGING_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          status=0
          "$EXPANSION_INDEX" build --catalog catalog.yaml --feed free \
            --previous "$INDEX_REF" --allow-missing-previous \
            --previous-username-env GITHUB_ACTOR --previous-password-env GITHUB_TOKEN \
            --key marquee-publisher-key.pub.pem \
            --candidate-username-env STAGING_REGISTRY_USERNAME --candidate-password-env STAGING_REGISTRY_TOKEN \
            --out index.json --format json > build.json || status=$?
          cat build.json
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          {
            echo "### Build"
            echo
            echo "previous: $(jq -r '.previous' build.json)"
            echo
            echo "tag: $(jq -r '.tag' build.json)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$(jq -r '.tag' build.json)" >> "$GITHUB_OUTPUT"
          echo "generated_at=$(jq -r '.generated_at' build.json)" >> "$GITHUB_OUTPUT"

      # Copy each image the build says is not yet listed, by digest, from the
      # private staging package to the public packs repository. The copy tool
      # fails unless the destination digest equals the source digest.
      - name: Copy new candidates to the packs repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_REGISTRY_USERNAME: ${{ secrets.STAGING_REGISTRY_USERNAME }}
          STAGING_REGISTRY_TOKEN: ${{ secrets.STAGING_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          jq -c '.images[] | select(.already_listed == false)' build.json > pending.jsonl
          : > to-sign.txt
          while IFS= read -r image; do
            candidate="$(jq -r '.candidate' <<<"$image")"
            destination="$(jq -r '.destination' <<<"$image")"
            version="$(jq -r '.version' <<<"$image")"
            "$EXPANSION_INDEX" copy \
              --from "$candidate" --to "${destination%@*}:${version}" \
              --from-username-env STAGING_REGISTRY_USERNAME --from-password-env STAGING_REGISTRY_TOKEN \
              --to-username-env GITHUB_ACTOR --to-password-env GITHUB_TOKEN \
              --format json
            printf '%s\n' "$destination" >> to-sign.txt
          done < pending.jsonl
          echo "images to sign: $(wc -l < to-sign.txt | tr -d ' ')"

      - name: Sign the copied pack images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            cosign sign --key env://COSIGN_PRIVATE_KEY \
              --new-bundle-format=false --use-signing-config=false \
              --tlog-upload=false --registry-referrers-mode=legacy --yes \
              "$ref"
          done < to-sign.txt

      - name: Push the index under its immutable tag
        id: push
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          digest="$("$EXPANSION_INDEX" push --index index.json --ref "$INDEX_REF" --tag "$TAG")"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "push did not print an index digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the index digest
        env:
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false \
            --tlog-upload=false --registry-referrers-mode=legacy --yes \
            "${INDEX_REF#oci://}@${INDEX_DIGEST}"

      # From a machine with no credentials, exactly as a console would. A
      # private package fails here, and latest stays where it was.
      - name: Verify anonymously before promoting
        env:
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          "$EXPANSION_INDEX" verify --ref "${INDEX_REF}@${INDEX_DIGEST}" \
            --key marquee-publisher-key.pub.pem \
            --expect-digest "$INDEX_DIGEST" --images --format json

      - name: Promote latest
        env:
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          "$EXPANSION_INDEX" promote --ref "$INDEX_REF" --digest "$INDEX_DIGEST" \
            --key marquee-publisher-key.pub.pem --tag latest --format json

      - name: Verify latest anonymously
        env:
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          "$EXPANSION_INDEX" verify --ref "${INDEX_REF}:latest" \
            --key marquee-publisher-key.pub.pem \
            --expect-digest "$INDEX_DIGEST" --images --format json

      - name: Record the result
        env:
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ steps.build.outputs.tag }}
          GENERATED_AT: ${{ steps.build.outputs.generated_at }}
        run: |
          set -euo pipefail
          {
            echo "### Published"
            echo
            echo "tag: $TAG"
            echo
            echo "digest: $INDEX_DIGEST"
            echo
            echo "generated_at: $GENERATED_AT"
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Open the Marquee page pull request
    needs: [tools, publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: marquee-docs
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tool
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: expansion-index
          path: tool

      - name: Refuse a tool whose checksum differs
        env:
          EXPECTED_SHA256: ${{ needs.tools.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum tool/expansion-index | cut -d' ' -f1)"
          if [ -z "$EXPECTED_SHA256" ] || [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "expansion-index checksum differs from the tools job: refusing to use it" >&2
            exit 1
          fi
          chmod 0755 tool/expansion-index
          echo "EXPANSION_INDEX=$GITHUB_WORKSPACE/tool/expansion-index" >> "$GITHUB_ENV"

      # Re-verifies the index the publish job just promoted, from no
      # credentials, and writes only what that signed index says.
      - name: Generate the Marquee page data
        env:
          INDEX_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "the publish job did not return an index digest" >&2
            exit 1
          fi
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          "$EXPANSION_INDEX" listing --index-ref "${INDEX_REF}@${INDEX_DIGEST}" \
            --key marquee-publisher-key.pub.pem \
            --catalog catalog.yaml --feed free --out marquee.json

      - name: Check out the docs repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: puppetlabs/stagehand-docs
          token: ${{ secrets.DOCS_PR_TOKEN }}
          path: stagehand-docs
          persist-credentials: false

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.DOCS_PR_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
          GENERATED_AT: ${{ needs.publish.outputs.generated_at }}
          INDEX_DIGEST: ${{ needs.publish.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]; then
            echo "the publish job did not return an immutable index tag" >&2
            exit 1
          fi
          branch="marquee/${TAG}"
          cd stagehand-docs
          if [ ! -f src/data/marquee.json ]; then
            echo "src/data/marquee.json is missing in ${DOCS_REPO}: merge the Marquee page change there first" >&2
            exit 1
          fi
          cp ../marquee.json src/data/marquee.json
          if git diff --quiet -- src/data/marquee.json; then
            echo "src/data/marquee.json already matches the published index; no pull request needed"
            exit 0
          fi
          # The branch name is predictable, so anyone who can open a pull request
          # in the docs repository could pre-open one with this head. Only a pull
          # request from this repository's own branch, opened by the token's own
          # account, counts as ours; anything else stops the job.
          me="$(gh api user --jq '.login')"
          existing="$(gh pr list --repo "$DOCS_REPO" --head "$branch" --state open \
            --json number,isCrossRepository,author)"
          foreign="$(jq --arg me "$me" '[.[] | select((.isCrossRepository == false and .author.login == $me) | not)] | length' <<<"$existing")"
          if [ "$foreign" != "0" ]; then
            echo "an open pull request with head ${branch} in ${DOCS_REPO} was not opened by ${me} from this repository's own branch: refusing to continue" >&2
            exit 1
          fi
          if [ "$(jq 'length' <<<"$existing")" != "0" ]; then
            echo "our pull request for ${branch} is already open"
            exit 0
          fi
          lookup=0
          git -c credential.helper= -c credential.helper='!gh auth git-credential' \
            ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1 || lookup=$?
          if [ "$lookup" = "0" ]; then
            echo "branch ${branch} already exists in ${DOCS_REPO} without our open pull request: refusing to push over it" >&2
            exit 1
          fi
          if [ "$lookup" != "2" ]; then
            echo "could not check whether branch ${branch} exists in ${DOCS_REPO} (git exit ${lookup})" >&2
            exit 1
          fi
          base="$(gh repo view "$DOCS_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          git checkout -b "$branch"
          git add src/data/marquee.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Marquee: catalog ${TAG}"
          git -c credential.helper= -c credential.helper='!gh auth git-credential' \
            push origin "HEAD:refs/heads/${branch}"
          body="$(mktemp)"
          {
            echo "Generated by the Stagehand Marquee catalog publish workflow."
            echo
            echo "- Index: ${INDEX_REF#oci://}@${INDEX_DIGEST}"
            echo "- Immutable tag: ${TAG}"
            echo "- generated_at: ${GENERATED_AT}"
            echo "- Workflow run: ${RUN_URL}"
            echo
            echo "This replaces src/data/marquee.json with exactly what the signed, anonymously verified index lists. A person reviews and merges it."
          } > "$body"
          new_url="$(gh pr create --repo "$DOCS_REPO" --base "$base" --head "$branch" \
            --title "Marquee: catalog ${TAG}" --body-file "$body")"
          echo "opened ${new_url}"
          echo "docs pull request: ${new_url}" >> "$GITHUB_STEP_SUMMARY"
          gh pr list --repo "$DOCS_REPO" --state open --json number,headRefName,isCrossRepository,author \
            | jq -r --arg keep "$branch" --arg me "$me" '.[] | select((.headRefName | startswith("marquee/")) and .headRefName != $keep and .isCrossRepository == false and .author.login == $me) | .number' \
            > superseded.txt
          while IFS= read -r number; do
            gh pr close "$number" --repo "$DOCS_REPO" --delete-branch \
              --comment "Superseded by ${new_url}"
          done < superseded.txt
